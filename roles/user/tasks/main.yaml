  - name: enable nodejs 20
    command: dnf module enable nodejs:20 -y
  - name: install nodejs 20 
    package:
      name: nodejs
      state: present
  - name: create roboshop system user
    user:
      name: roboshop
      system: true 
      home: /app
      shell: /sbin/nologin
      comment: "Roboshop System User"
  - name: Remove a directory 
    file:
      path: /app
      state: absent
  - name: delete user.zip file from tmp folder 
    file:
      path: /tmp/user.zip
      state: absent
  - name: create app directory 
    file:
      path: /app
      state: directory
  - name: Download the user code
    get_url:
      url: "https://roboshop-artifacts.s3.amazonaws.com/user-v3.zip"
      dest: /tmp/user.zip
  - name: Copy and unzip local file to remote server
    unarchive:
      src: /tmp/user.zip
      dest: /app
      remote_src: yes
  - name: install dependencies
    community.general.npm:
      path: /app
  - name: copy user service
    template:
      src: user.service.j2
      dest: /etc/systemd/system/user.service
  
  - name: daemon reload
    systemd_service:
      name: user
      daemon_reload: true
  - name: Start the service
    service:
      name: user
      state: restarted
      enabled: yes