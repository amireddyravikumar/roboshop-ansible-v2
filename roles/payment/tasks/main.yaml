- name: application setup
  import_role:
    name: common
    tasks_from: app-setup

- name: install python 
  package:
    name:  "{{ item }}"
    state: present
  loop:
  - python3
  - gcc
  - python3-devel

- name: install dependencies
  pip:
    requirements: requirements.txt
    executable: pip3.9
  args:
    chdir: /app

- name: systemd setup
  import_role:
    name: common
    tasks_from: systed-setup

- name: Enable and Start the payment service
  service:
    name: payment
    state: restarted
    enabled: yes