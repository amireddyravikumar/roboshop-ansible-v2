  - name: enable nodejs 20
    command: dnf module enable nodejs:20 -y
  - name: install nodejs 20 
    package:
      name: nodejs
      state: present
  - name: create roboshop system cart
    user:
      name: roboshop
      system: true 
      home: /app
      shell: /sbin/nologin
      comment: "Roboshop System cart"
  - name: Remove a directory 
    file:
      path: /app
      state: absent
  - name: delete cart.zip file from tmp folder 
    file:
      path: /tmp/cart.zip
      state: absent
  - name: create app directory 
    file:
      path: /app
      state: directory
  - name: Download the cart code
    get_url:
      url: "https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip"
      dest: /tmp/cart.zip
  - name: Copy and unzip local file to remote server
    unarchive:
      src: /tmp/cart.zip
      dest: /app
      remote_src: yes
  - name: install dependencies
    community.general.npm:
      path: /app
  - name: copy cart service
    template:
      src: cart.service.j2
      dest: /etc/systemd/system/cart.service
   
  - name: daemon reload
    systemd_service:
      name: cart
      daemon_reload: true
  - name: Start the service
    service:
      name: cart
      state: restarted
      enabled: yes