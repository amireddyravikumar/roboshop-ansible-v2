  - name: enable nodejs 20
    command: dnf module enable nodejs:20 -y
  - name: install nodejs 20 
    package:
      name: nodejs
      state: present
  - name: create roboshop system user
    user:
      name: roboshop
      system: true 
      home: /app
      shell: /sbin/nologin
      comment: "Roboshop System User"
  - name: Remove a directory 
    file:
      path: /app
      state: absent
  - name: delete catalogue.zip file from tmp folder 
    file:
      path: /tmp/catalogue.zip
      state: absent
  - name: create app directory 
    file:
      path: /app
      state: directory
  - name: Download the catalogue code
    get_url:
      url: "https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip"
      dest: /tmp/catalogue.zip
  - name: Copy and unzip local file to remote server
    unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes
  - name: install dependencies
    community.general.npm:
      path: /app
  - name: copy catalogue service
    template:
      src: catalogue.service.j2
      dest: /etc/systemd/system/catalogue.service
  - name: copy the mongo repo
    copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo
  - name: install mongodb client
    package:
      name: mongodb-mongosh
      state: present
  - name: catalogue exist or not
    shell: mongosh --host mongodb.amireddyravi.space --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
    register: catalogue_output
    tags:
    - mongodb
  - name: print catalogue 
    debug:
      msg: "{{ catalogue_output }}"
    tags:
    - mongodb
  - name: load products to mongodb
    shell: mongosh --host "{{ MONGODB_HOST }}" </app/db/master-data.js
    when: catalogue_output.stdout | int < 0 
    tags:
    - mongodb
  - name: daemon reload
    systemd_service:
      name: catalogue
      daemon_reload: true
  - name: Start the service
    service:
      name: catalogue
      state: restarted
      enabled: yes