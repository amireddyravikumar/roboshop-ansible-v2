  - name: get awssecret manager
    debug:
      msg: "{{ lookup('amazon.aws.aws_secret', 'roboshop/mysql_root_pasword', region='us-east-1')}}"  
  - name: install mysql server 
    package:
      name: mysql-server
      state: present
  
  - name: Start the service
    service:
      name: "mysqld"
      state: started
      enabled: yes
  - name: setup root password
    command: mysql_secure_installation --set-root-pass {{ MYSQL_ROOT_PASSWORD }}